[project]
name = "roomly-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # runtime packages only, add as you choose them
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "PTH", "T20", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"



[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]